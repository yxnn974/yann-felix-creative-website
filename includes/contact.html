<section class="section">
  <div class="container">

    <h1 class="section-title gradient-text">Contact</h1>
    <div class="section-divider"></div>

    <div class="contact-grid">

      <div class="card">
        <h2 class="card-title">Informations</h2>
        <p>
          IUT de La Réunion<br />
          Saint-Pierre
        </p>
        <p class="contact-email">
          Email :
          <a href="mailto:contact@yannfelix.com">contact@yannfelix.com</a>
        </p>
      </div>

      <div class="card">
        <h2 class="card-title">M’écrire</h2>

        <!--
          data-endpoint : adresse d'un service de formulaire (ex. https://formspree.io/f/xxxxxx).
          Laissé vide, le bouton ouvre le client mail avec le message pré-rempli.
        -->
        <form id="contact-form" data-endpoint="" data-email="contact@yannfelix.com">
          <label>
            Nom
            <input type="text" name="name" autocomplete="name" required maxlength="80" />
          </label>

          <label>
            Email
            <input type="email" name="email" autocomplete="email" required maxlength="120" />
          </label>

          <label>
            Message
            <textarea name="message" required minlength="10" maxlength="3000"></textarea>
          </label>

          <!-- Champ piège à robots, invisible -->
          <div class="hp" aria-hidden="true">
            <label>Ne pas remplir <input type="text" name="website" tabindex="-1" autocomplete="off" /></label>
          </div>

          <button type="submit" class="btn btn-primary full-width">Envoyer</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>

    </div>
  </div>
</section>
