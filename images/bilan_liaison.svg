<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060b14"/>
      <stop offset="1" stop-color="#0d2a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <ellipse cx="640" cy="330" rx="520" ry="230" fill="url(#glow)"/>

  <!-- relief -->
  <path d="M0 640 L180 560 L330 610 L520 540 L700 600 L880 550 L1060 600 L1280 530 L1280 720 L0 720 Z" fill="#081322"/>

  <!-- ellipsoïde de Fresnel -->
  <ellipse cx="640" cy="330" rx="420" ry="105" fill="rgba(0,200,255,0.07)" stroke="#00c8ff" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- faisceau -->
  <line x1="230" y1="330" x2="1050" y2="330" stroke="#00c8ff" stroke-width="3" stroke-dasharray="4 10" stroke-linecap="round"/>

  <!-- mât gauche -->
  <g stroke="#8fafc8" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="190" y1="560" x2="190" y2="300"/>
    <line x1="160" y1="560" x2="190" y2="470"/>
    <line x1="220" y1="560" x2="190" y2="470"/>
  </g>
  <path d="M212 280 Q250 330 212 380" stroke="#00c8ff" stroke-width="9" fill="none" stroke-linecap="round"/>
  <line x1="190" y1="330" x2="226" y2="330" stroke="#00c8ff" stroke-width="4"/>

  <!-- mât droit -->
  <g stroke="#8fafc8" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="1090" y1="560" x2="1090" y2="300"/>
    <line x1="1060" y1="560" x2="1090" y2="470"/>
    <line x1="1120" y1="560" x2="1090" y2="470"/>
  </g>
  <path d="M1068 280 Q1030 330 1068 380" stroke="#00c8ff" stroke-width="9" fill="none" stroke-linecap="round"/>
  <line x1="1090" y1="330" x2="1054" y2="330" stroke="#00c8ff" stroke-width="4"/>

  <!-- cote -->
  <g stroke="#e8f4ff" stroke-width="2" stroke-opacity="0.7" fill="none">
    <line x1="250" y1="620" x2="1030" y2="620"/>
    <line x1="250" y1="608" x2="250" y2="632"/>
    <line x1="1030" y1="608" x2="1030" y2="632"/>
  </g>
  <rect x="570" y="598" width="140" height="44" rx="10" fill="#060b14"/>
  <text x="640" y="629" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e8f4ff">15 km</text>
</svg>
